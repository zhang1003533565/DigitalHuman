name: Deploy DigitalHuman

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: digitalhuman-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}
  DIGITALHUMAN_BACKEND_IMAGE: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/digitalhuman-backend
  DIGITALHUMAN_AI_SERVICE_IMAGE: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/digitalhuman-ai-service
  DIGITALHUMAN_FRONTEND_ADMIN_IMAGE: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/digitalhuman-frontend-admin
  DIGITALHUMAN_FRONTEND_VISITOR_IMAGE: ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/digitalhuman-frontend-visitor

jobs:
  verify:
    name: Verify deployment contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify deployment files
        run: node scripts/verify_deployment_config.mjs

  build:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            dockerfile: backend-java/Dockerfile
            context: .
            image_env: DIGITALHUMAN_BACKEND_IMAGE
          - service: ai-service
            dockerfile: ai-service/Dockerfile
            context: ai-service
            image_env: DIGITALHUMAN_AI_SERVICE_IMAGE
          - service: frontend-admin
            dockerfile: frontend-admin/Dockerfile
            context: .
            image_env: DIGITALHUMAN_FRONTEND_ADMIN_IMAGE
          - service: frontend-visitor
            dockerfile: frontend-visitor/Dockerfile
            context: .
            image_env: DIGITALHUMAN_FRONTEND_VISITOR_IMAGE
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.image_env }}" in
            DIGITALHUMAN_BACKEND_IMAGE) image="$DIGITALHUMAN_BACKEND_IMAGE" ;;
            DIGITALHUMAN_AI_SERVICE_IMAGE) image="$DIGITALHUMAN_AI_SERVICE_IMAGE" ;;
            DIGITALHUMAN_FRONTEND_ADMIN_IMAGE) image="$DIGITALHUMAN_FRONTEND_ADMIN_IMAGE" ;;
            DIGITALHUMAN_FRONTEND_VISITOR_IMAGE) image="$DIGITALHUMAN_FRONTEND_VISITOR_IMAGE" ;;
            *) echo "Unknown image env: ${{ matrix.image_env }}" >&2; exit 1 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Login to Aliyun ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/digitalhuman_deploy
          chmod 600 ~/.ssh/digitalhuman_deploy
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload remote deployment files
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/digitalhuman_deploy -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}'"
          scp -i ~/.ssh/digitalhuman_deploy -P "${{ secrets.DEPLOY_PORT }}" \
            deploy/compose.prod.yml \
            deploy/remote/deploy.sh \
            deploy/remote/cleanup.sh \
            deploy/remote/.env.example \
            deploy/remote/README.md \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Run remote deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            chmod +x deploy.sh cleanup.sh
            ./deploy.sh
