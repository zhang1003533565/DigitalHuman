services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: digitalhuman-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./storage/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: digitalhuman-ai-service
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "18755:18755"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: scenic_kb
      RAG_KNOWLEDGE_BASE_DIR: /data/knowledge-base
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-}
    volumes:
      - ./knowledge-base:/data/knowledge-base
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:18755/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
