server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

tts:
  output-dir: ${user.dir}/tts
  base-url: ${TTS_BASE_URL:http://localhost:8080}
  edge-service-url: ${EDGE_TTS_SERVICE_URL:http://127.0.0.1:18754}
