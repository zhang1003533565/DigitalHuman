server:
  port: 8080
  error:
    include-message: always

spring:
  config:
    import:
      - optional:file:./config/application-shared.properties
      - optional:file:../config/application-shared.properties
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:digitalhuman}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  devtools:
    restart:
      enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

tts:
  output-dir: ${user.dir}/tts
  base-url: ${TTS_BASE_URL:${tts.base-url:${app.backend-base-url:http://localhost:8080}}}
  edge-service-url: ${EDGE_TTS_SERVICE_URL:${app.ai-service-url:http://127.0.0.1:18755}}

rag:
  service-url: ${RAG_SERVICE_URL:${app.ai-service-url:http://127.0.0.1:18755}}

app:
  auth:
    seed-users:
      - username: admin
        password: admin123
        display-name: System Admin
        role: ADMIN
      - username: user
        password: user123
        display-name: Visitor User
        role: USER
